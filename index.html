<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>やんごとなき貴族の戯れ-世界征服サミット2026-</title>
  <style>
    :root {
      --navy: #10172c;
      --gold: #d9b65a;
      --cream: #fff9e9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--cream);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      background:
        radial-gradient(circle at top, rgba(217, 182, 90, 0.2), transparent 35%),
        linear-gradient(135deg, #090d1b, var(--navy) 55%, #25101b);
    }

    .container {
      width: min(90%, 720px);
      padding: 64px 28px;
      text-align: center;
      border: 1px solid rgba(217, 182, 90, 0.7);
      border-radius: 8px;
      background: rgba(10, 14, 30, 0.75);
    }

    h1 {
      margin: 20px 0 12px;
      color: var(--gold);
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.5;
    }

    .crown {
      margin: 0;
      color: var(--gold);
      font-size: 2.4rem;
    }

    button {
      padding: 16px 36px;
      border: 1px solid var(--gold);
      border-radius: 4px;
      color: #241507;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(#f3d983, var(--gold));
    }

    #answer-area {
      display: none;
      margin-top: 32px;
      padding-top: 28px;
      border-top: 1px solid rgba(217, 182, 90, 0.45);
    }

    input {
      width: min(100%, 420px);
      margin: 12px 0 16px;
      padding: 14px;
      border: 1px solid var(--gold);
      border-radius: 4px;
      color: var(--cream);
      font: inherit;
      background: rgba(255, 255, 255, 0.08);
    }
    
    body {
  min-height: 100dvh;
  padding:
    max(16px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(16px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));
}

.container {
  width: min(100%, 720px);
}

button,
input {
  min-height: 48px;
  font-size: 16px;
}

button {
  max-width: 100%;
  line-height: 1.4;
}

@media (max-width: 480px) {
  .container {
    padding: 40px 18px;
  }

  h1 {
    margin-top: 14px;
    font-size: 1.75rem;
    line-height: 1.45;
  }

  .crown {
    font-size: 2rem;
  }

  #answer-area {
    margin-top: 24px;
    padding-top: 24px;
  }

  input,
  button {
    width: 100%;
  }
}
  </style>
</head>
<body>
  <main class="container">
    <p class="crown">♛</p>
    <h1>やんごとなき貴族の戯れ<br>― 世界征服サミット2026 ―</h1>
    <p>選ばれし者よ、謎を解き明かせ。</p>

    <button id="start-button" type="button">謎解きを開始</button>

    <section id="answer-area">
      <form action="answer.html" method="get">
        <label for="answer">解答を入力してください</label><br>
        <input
          id="answer"
          name="answer"
          type="text"
          placeholder="ここに解答を入力"
          autocomplete="off"
          required
        ><br>
        <button type="submit">解答してキーワードを開示する</button>
      </form>
    </section>
  </main>

  <script src="keywords.js"></script>
  <script>
    const startButton = document.getElementById("start-button");
    const answerArea = document.getElementById("answer-area");
    const answerInput = document.getElementById("answer");
    const answerForm = answerArea.querySelector("form");

    startButton.addEventListener("click", () => {
      answerArea.style.display = "block";
      startButton.style.display = "none";
      answerInput.focus();
    });

    answerForm.addEventListener("submit", () => {
      const entry = window.keywordEntries.find(
      (keywordEntry) =>
        (keywordEntry.answer === answer ||
          keywordEntry.aliases?.includes(answer)) &&
        keywordEntry.type === "answer"
    );

      answerForm.action =
        entry?.type === "agreement" ? "agreement.html" : "answer.html";
    });
  </script>
</body>
</html>
